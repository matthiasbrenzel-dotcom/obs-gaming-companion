name: Windows Build + Setup EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        shell: powershell
        run: |
          choco install cmake ninja innosetup -y
          cmake --version

      - name: Build OBS Gaming Companion
        shell: powershell
        run: |
          if (Test-Path ".\build-windows.ps1") {
            .\build-windows.ps1
          } else {
            throw "build-windows.ps1 wurde im Repository nicht gefunden."
          }

      - name: Show generated files
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Recurse -File |
            Where-Object { $_.Extension -in ".dll",".exe",".zip" } |
            Select-Object FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Gaming-Companion-Windows-x64
          path: |
            dist/**
            installer/output/**
            build/**/*.dll
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/*.exe
            dist/*.zip
